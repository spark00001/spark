<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chernobyl</title>
  <link rel="stylesheet" href="https://spark00001.github.io/css/spark_player.css">
  <style>
    /* Base Container Styling */
    .video-container {
      position: relative;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    /* Inactivity & Hide Rules */
    .video-container.hide-controls {
      cursor: none;
    }

    .video-container.hide-controls .controls-overlay,
    .video-container.hide-controls .lock-btn {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .controls-overlay,
    .lock-btn {
      transition: opacity 0.25s ease;
    }

    /* Locked state control visibility */
    .controls-overlay.locked {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Episodes Drawer */
    .episodes-drawer {
      position: absolute;
      top: 0;
      right: -340px;
      width: 320px;
      height: 100%;
      background: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 15px rgba(0, 0, 0, 0.5);
      color: #fff;
    }

    .episodes-drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .drawer-header h3 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .close-drawer-btn {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 1.4rem;
      line-height: 1;
    }

    .close-drawer-btn:hover {
      color: #fff;
    }

    /* Season Selector */
    .season-selector-wrapper {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .season-select {
      width: 100%;
      padding: 8px 12px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    /* Episode List */
    .episode-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 8px 0;
    }

    .episode-item {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 3px solid transparent;
      transition: background 0.2s;
    }

    .episode-item:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .episode-item.active {
      background: rgba(255, 255, 255, 0.12);
      border-left-color: #e50914;
    }

    .episode-info {
      flex: 1;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-right: 8px;
    }

    .episode-title {
      font-size: 0.88rem;
      font-weight: 500;
    }

    .episode-meta {
      font-size: 0.75rem;
      color: #888;
    }

    /* Item & Control Buttons */
    .ep-download-btn {
      background: transparent;
      border: none;
      color: #aaa;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s;
    }

    .ep-download-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
    }

    .control-btn svg,
    .ep-download-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="video-container" id="videoContainer">
    <!-- Lock Controls Button -->
    <button class="lock-btn" id="lockBtn" title="Lock Screen UI (L)">
      <svg id="unlockedIcon" viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/></svg>
      <svg id="lockedIcon" viewBox="0 0 24 24" style="display:none;"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
    </button>

    <!-- HTML5 Video Player with nodownload restriction -->
    <video id="videoPlayer" preload="metadata" playsinline controlsList="nodownload"></video>

    <!-- Episodes / Seasons Drawer -->
    <aside class="episodes-drawer" id="episodesDrawer">
      <div class="drawer-header">
        <h3 id="seriesTitle">Episodes</h3>
        <button class="close-drawer-btn" id="closeDrawerBtn">&times;</button>
      </div>
      <div class="season-selector-wrapper">
        <select class="season-select" id="seasonSelect"></select>
      </div>
      <ul class="episode-list" id="episodeList"></ul>
    </aside>

    <!-- Custom Controls UI -->
    <div class="controls-overlay" id="controlsOverlay">
      <!-- Progress Bar -->
      <div class="timeline-container" id="timelineContainer">
        <div class="timeline-progress" id="timelineProgress"></div>
      </div>

      <!-- Button Controls -->
      <div class="controls-row">
        <div class="controls-left">
          <!-- Play / Pause -->
          <button class="control-btn" id="playBtn" title="Play/Pause (Space / K)">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <!-- Volume / Mute -->
          <div class="volume-group">
            <button class="control-btn" id="muteBtn" title="Mute (M)">
              <svg id="volHighIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg id="volMuteIcon" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
          </div>

          <!-- Time Display -->
          <div class="time-display">
            <span id="currentTime">00:00:00</span> / <span id="duration">00:00:00</span>
          </div>
        </div>

        <div class="controls-right">
          <!-- Current Episode Download Button -->
          <button class="control-btn" id="currentDownloadBtn" title="Download Current Episode">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
          </button>

          <!-- Playlist / Episodes Drawer Toggle -->
          <button class="control-btn" id="drawerToggleBtn" title="Episodes & Seasons">
            <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12zM10 9l6 3.5L10 16z"/></svg>
          </button>

          <!-- Fullscreen Toggle -->
          <button class="control-btn" id="fullscreenBtn" title="Fullscreen (F)">
            <svg id="enterFullscreenIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <svg id="exitFullscreenIcon" viewBox="0 0 24 24" style="display:none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const seriesData = {
      title: "Chernobyl",
      seasons: [
        {
          seasonNumber: 1,
          seasonName: "Season 1",
          episodes: [
            {
              id: "s1e1",
              title: "Episode 1: 1:23:45",
              duration: "1:23:45",
              src: "https://github.com/spark00001/movie/raw/refs/heads/main/chernobyl.s1e1.mkv",
              downloadFileName: "Chernobyl.s1e1.mkv",
              poster: "/images/chernobyl_thumbnail.png"
            },
            {
              id: "s1e2",
              title: "Episode 2: Please Remain Calm",
              duration: "65m",
              src: "https://github.com/spark00001/movie/raw/refs/heads/main/chernobyl.s1e2.mkv",
              downloadFileName: "Chernobyl.s1e2.mkv",
              poster: "/images/chernobyl_thumbnail.png"
            },
            {
              id: "s1e3",
              title: "Episode 3: Open Wide, O Earth",
              duration: "61m",
              src: "https://github.com/spark00001/movie/raw/refs/heads/main/chernobyl.s1e3.mkv",
              downloadFileName: "Chernobyl.s1e3.mkv",
              poster: "/images/chernobyl_thumbnail.png"
            },
            {
              id: "s1e4",
              title: "Episode 4: The Happiness of All Mankind",
              duration: "70m",
              src: "https://github.com/spark00001/movie/raw/refs/heads/main/chernobyl.s1e4.mkv",
              downloadFileName: "Chernobyl.s1e4.mkv",
              poster: "/images/chernobyl_thumbnail.png"
            },
            {
              id: "s1e5",
              title: "Episode 5: Vichnaya Pamyat",
              duration: "71m",
              src: "https://github.com/spark00001/movie/raw/refs/heads/main/chernobyl.s1e5.mkv",
              downloadFileName: "Chernobyl.s1e5.mkv",
              poster: "/images/chernobyl_thumbnail.png"
            }
          ]
        }
      ]
    };

    let currentSeasonIndex = 0;
    let currentEpisodeIndex = 0;
    let isLocked = false;
    let hideControlsTimeout = null;

    // Elements
    const video = document.getElementById("videoPlayer");
    const container = document.getElementById("videoContainer");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const muteBtn = document.getElementById("muteBtn");
    const volHighIcon = document.getElementById("volHighIcon");
    const volMuteIcon = document.getElementById("volMuteIcon");
    const volumeSlider = document.getElementById("volumeSlider");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const timelineContainer = document.getElementById("timelineContainer");
    const timelineProgress = document.getElementById("timelineProgress");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const enterFullscreenIcon = document.getElementById("enterFullscreenIcon");
    const exitFullscreenIcon = document.getElementById("exitFullscreenIcon");
    const lockBtn = document.getElementById("lockBtn");
    const unlockedIcon = document.getElementById("unlockedIcon");
    const lockedIcon = document.getElementById("lockedIcon");
    const controlsOverlay = document.getElementById("controlsOverlay");

    // Drawer Elements
    const seasonSelect = document.getElementById("seasonSelect");
    const episodeList = document.getElementById("episodeList");
    const episodesDrawer = document.getElementById("episodesDrawer");
    const drawerToggleBtn = document.getElementById("drawerToggleBtn");
    const closeDrawerBtn = document.getElementById("closeDrawerBtn");
    const currentDownloadBtn = document.getElementById("currentDownloadBtn");

    // Prevent context menu
    container.addEventListener("contextmenu", (e) => e.preventDefault());

    // --- IDLE CURSOR & CONTROLS AUTO-HIDE ---
    function showControls() {
      container.classList.remove("hide-controls");
      clearTimeout(hideControlsTimeout);

      // Hide only while video is actively playing or when locked
      if (!video.paused || isLocked) {
        hideControlsTimeout = setTimeout(() => {
          if (!episodesDrawer.classList.contains("open")) {
            container.classList.add("hide-controls");
          }
        }, 3000);
      }
    }

    container.addEventListener("mousemove", showControls);
    container.addEventListener("mousedown", showControls);
    container.addEventListener("touchstart", showControls, { passive: true });
    container.addEventListener("mouseleave", () => {
      if (!video.paused || isLocked) {
        container.classList.add("hide-controls");
      }
    });

    // --- PLAY / PAUSE LOGIC ---
    function togglePlay() {
      if (isLocked) return;
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    playBtn.addEventListener("click", togglePlay);
    video.addEventListener("click", togglePlay);

    video.addEventListener("play", () => {
      playIcon.style.display = "none";
      pauseIcon.style.display = "block";
      showControls();
    });

    video.addEventListener("pause", () => {
      playIcon.style.display = "block";
      pauseIcon.style.display = "none";
      showControls();
    });

    // --- VOLUME CONTROL ---
    muteBtn.addEventListener("click", () => {
      if (isLocked) return;
      video.muted = !video.muted;
      updateVolumeUI();
      showControls();
    });

    volumeSlider.addEventListener("input", (e) => {
      if (isLocked) return;
      video.volume = e.target.value;
      video.muted = video.volume === 0;
      updateVolumeUI();
      showControls();
    });

    function updateVolumeUI() {
      if (video.muted || video.volume === 0) {
        volHighIcon.style.display = "none";
        volMuteIcon.style.display = "block";
        volumeSlider.value = 0;
      } else {
        volHighIcon.style.display = "block";
        volMuteIcon.style.display = "none";
        volumeSlider.value = video.volume;
      }
    }

    // --- TIMELINE & TIME FORMATTING ---
    function formatTime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if (h > 0) {
        return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      }
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    video.addEventListener("timeupdate", () => {
      if (!video.duration) return;
      const pct = (video.currentTime / video.duration) * 100;
      timelineProgress.style.width = `${pct}%`;
      currentTimeEl.textContent = formatTime(video.currentTime);
    });

    video.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(video.duration);
    });

    timelineContainer.addEventListener("click", (e) => {
      if (isLocked) return;
      const rect = timelineContainer.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      video.currentTime = pos * video.duration;
      showControls();
    });

    // --- FULLSCREEN ---
    fullscreenBtn.addEventListener("click", () => {
      if (isLocked) return;
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch((err) => console.log(err));
      } else {
        document.exitFullscreen();
      }
      showControls();
    });

    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement) {
        enterFullscreenIcon.style.display = "none";
        exitFullscreenIcon.style.display = "block";
      } else {
        enterFullscreenIcon.style.display = "block";
        exitFullscreenIcon.style.display = "none";
      }
    });

    // --- LOCK SCREEN FEATURE ---
    lockBtn.addEventListener("click", () => {
      isLocked = !isLocked;
      if (isLocked) {
        unlockedIcon.style.display = "none";
        lockedIcon.style.display = "block";
        controlsOverlay.classList.add("locked");
        episodesDrawer.classList.remove("open");
      } else {
        unlockedIcon.style.display = "block";
        lockedIcon.style.display = "none";
        controlsOverlay.classList.remove("locked");
      }
      showControls();
    });

    // --- KEYBOARD SHORTCUTS ---
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (e.key === "l" || e.key === "L") {
        lockBtn.click();
        return;
      }
      if (isLocked) return;

      if (e.key === " " || e.key === "k" || e.key === "K") {
        e.preventDefault();
        togglePlay();
      } else if (e.key === "f" || e.key === "F") {
        fullscreenBtn.click();
      } else if (e.key === "m" || e.key === "M") {
        muteBtn.click();
      } else if (e.key === "ArrowRight") {
        video.currentTime = Math.min(video.duration, video.currentTime + 5);
      } else if (e.key === "ArrowLeft") {
        video.currentTime = Math.max(0, video.currentTime - 5);
      }
      showControls();
    });

    // --- DRAWER & DOWNLOAD ---
    function triggerDownload(url, filename) {
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.setAttribute("download", filename || "episode-video");
      anchor.target = "_blank";
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
    }

    function initSeries() {
      document.getElementById("seriesTitle").textContent = seriesData.title;

      seasonSelect.innerHTML = "";
      seriesData.seasons.forEach((season, index) => {
        const opt = document.createElement("option");
        opt.value = index;
        opt.textContent = season.seasonName;
        seasonSelect.appendChild(opt);
      });

      seasonSelect.addEventListener("change", (e) => {
        currentSeasonIndex = parseInt(e.target.value, 10);
        renderEpisodeList();
      });

      renderEpisodeList();
      loadEpisode(0, 0, false);
    }

    function renderEpisodeList() {
      episodeList.innerHTML = "";
      const episodes = seriesData.seasons[currentSeasonIndex].episodes;

      episodes.forEach((ep, index) => {
        const li = document.createElement("li");
        li.className = `episode-item ${index === currentEpisodeIndex ? "active" : ""}`;

        const infoDiv = document.createElement("div");
        infoDiv.className = "episode-info";
        infoDiv.innerHTML = `
          <div class="episode-title">${ep.title}</div>
          <div class="episode-meta">Duration: ${ep.duration}</div>
        `;
        infoDiv.addEventListener("click", () => {
          loadEpisode(currentSeasonIndex, index, true);
        });

        const dlBtn = document.createElement("button");
        dlBtn.className = "ep-download-btn";
        dlBtn.title = `Download ${ep.title}`;
        dlBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>`;
        dlBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          triggerDownload(ep.src, ep.downloadFileName);
        });

        li.appendChild(infoDiv);
        li.appendChild(dlBtn);
        episodeList.appendChild(li);
      });
    }

    function loadEpisode(seasonIdx, epIdx, autoplay = true) {
      currentSeasonIndex = seasonIdx;
      currentEpisodeIndex = epIdx;
      seasonSelect.value = seasonIdx;

      const ep = seriesData.seasons[seasonIdx].episodes[epIdx];
      video.src = ep.src;
      video.load();

      if (autoplay) {
        video.play().catch(() => {});
      }

      renderEpisodeList();
      showControls();
    }

    currentDownloadBtn.addEventListener("click", () => {
      const currentEp = seriesData.seasons[currentSeasonIndex].episodes[currentEpisodeIndex];
      if (currentEp) {
        triggerDownload(currentEp.src, currentEp.downloadFileName);
      }
    });

    drawerToggleBtn.addEventListener("click", () => {
      episodesDrawer.classList.toggle("open");
      showControls();
    });

    closeDrawerBtn.addEventListener("click", () => {
      episodesDrawer.classList.remove("open");
      showControls();
    });

    video.addEventListener("ended", () => {
      const currentSeason = seriesData.seasons[currentSeasonIndex];
      if (currentEpisodeIndex + 1 < currentSeason.episodes.length) {
        loadEpisode(currentSeasonIndex, currentEpisodeIndex + 1, true);
      }
    });

    initSeries();
  </script>
</body>
</html>
